# WATCHTOWER default configuration.
#
# Every knob below trades false positives (alerts on harmless traffic, which
# train analysts to ignore the report) against missed attacks (an attacker who
# stays just under a threshold). Copy this file, tune it to your traffic and
# pass it with --config. Anything you leave out keeps the value shown here.
# Unknown keys are rejected, so a typo cannot silently disable a detector.

# ---------------------------------------------------------------------------
# allowlist: clients dropped BEFORE detection. Single IPs or CIDR networks.
#
# Use it for your own noisy-but-trusted machines (uptime monitors, load
# balancer health checks, internal vulnerability scanners). Keep it short:
# every entry is a blind spot, and an attacker who lands on an allowlisted
# host (or a shared network you allowlisted) is invisible to WATCHTOWER.
# Prefer single /32 addresses over wide ranges. Uncomment and edit:
allowlist: []
#  - 192.0.2.10            # your uptime monitor
#  - 198.51.100.0/28       # your internal scanner subnet

# ---------------------------------------------------------------------------
# detectors: per-detector options. Each one also accepts `enabled: false`.
detectors:

  # Signature detector: known-bad user agents, sensitive paths and exploit
  # payloads (SQLi, XSS, traversal, command injection, Log4Shell).
  signatures:
    enabled: true
    # Raw log lines kept as evidence per alert. More helps an analyst confirm
    # the hit; fewer keeps reports small. Does not change what is detected.
    max_evidence: 5

  # 404 burst: many "not found" answers in a short window means someone is
  # guessing paths (directory brute forcing, T1595.003).
  enumeration:
    enabled: true
    # 404s from one client within the window before alerting.
    # Lower: catches slow, careful enumeration, but a user on a page with a
    #        few broken images or an old bookmark set starts to trip it.
    # Higher: fewer false alarms, but low-and-slow tools slip under.
    threshold: 20
    # Window length in seconds. Longer windows catch slower scans and cost a
    # little more memory per client.
    window_seconds: 60
    # A second, slower window for patient enumeration that paces itself under
    # the fast threshold (e.g. one guess every few seconds). Raise
    # slow_threshold if long-lived clients with many broken links trip it;
    # lower it or widen the window to catch even slower scans. Ignored by a
    # detector version that does not support it.
    slow_threshold: 100
    slow_window_seconds: 900
    # Network channel: also count activity per network, so one attacker
    # rotating through many addresses still adds up. Alerts from it name the
    # network (e.g. 2001:db8:abcd:12::/64) instead of one address. Ignored by
    # a detector version that does not support it.
    # ipv6_prefix (32-128): a single host or customer usually owns a whole
    #   /64, so rotating addresses inside it costs an attacker nothing. A
    #   shorter prefix (/56, /48) catches rotation across a customer's whole
    #   allocation but can merge separate customers of one ISP.
    # ipv4_prefix (8-32 or null): off by default. Carrier-grade NAT and ISP
    #   address pools put unrelated users in the same /24, so grouping IPv4
    #   merges strangers into one "attacker". Enable (e.g. 24) only for
    #   networks you know are single-tenant, such as hosting ranges.
    # min_distinct: addresses a network needs before it is reported as a
    #   network. Lower catches small rotations but flags networks where two or
    #   three genuine users happened to trip the threshold together.
    ipv6_prefix: 64
    ipv4_prefix: null
    min_distinct: 4

  # Brute force: repeated failed logins (401/403) from one client, and a
  # success after the failures (a likely compromised account, T1110).
  brute_force:
    enabled: true
    # Failed logins within the window before alerting.
    # Lower: catches password spraying sooner, but a user who forgot their
    #        password (or a misconfigured app retrying) gets flagged.
    # Higher: quieter, but gives the attacker that many free guesses per window.
    threshold: 10
    # Window length in seconds. Five minutes catches most tools; slow
    # credential stuffing spread over hours needs a longer window.
    window_seconds: 300
    # POSTs to these paths count as login attempts. Matched exactly (a query
    # string is allowed), not as prefixes, so /admin covers only /admin itself
    # and not every form under /admin/. Add your application's real login
    # endpoints, or brute force against them goes unseen; avoid broad paths,
    # or ordinary form submissions answered 403 look like failed logins.
    login_paths:
      - /login
      - /signin
      - /wp-login.php
      - /admin
      - /admin/login
      - /api/auth
      - /api/login
      - /user/login
      - /xmlrpc.php           # WordPress XML-RPC, a favourite brute-force target
    # Optional, left to the detector's own defaults unless set here:
    # login_keywords: words that mark other paths as login endpoints (e.g.
    #   /portal/sign-in). More words catch custom login pages; generic ones
    #   ("account", "user") turn ordinary form posts into "login attempts".
    #   [] switches keyword matching off. Detector default:
    #   login_keywords: [login, logon, signin, sign-in, sign_in, auth,
    #                    authenticate, token, session, sessions, oauth]
    # path_agnostic_factor: failed POSTs (401/403) to paths that are not
    #   recognised logins still count once a client reaches this many times
    #   the threshold. Lower catches brute force against unknown login URLs
    #   (e.g. an API with its own auth); higher keeps busy API clients quiet.
    #   path_agnostic_factor: 2
    # Network channel, as for enumeration above.
    ipv6_prefix: 64
    ipv4_prefix: null
    min_distinct: 4

  # Rate spike: request floods (application-layer DoS, T1499) or very
  # aggressive crawlers.
  rate:
    enabled: true
    # Requests from one client within the window before alerting.
    # Lower: catches smaller floods, but busy NAT gateways, office proxies and
    #        API clients look like attackers.
    # Higher: only flags real floods; a moderate scraper passes unnoticed.
    threshold: 300
    window_seconds: 60
    # Network channel, as for enumeration above.
    ipv6_prefix: 64
    ipv4_prefix: null
    min_distinct: 4

  # Low and slow: a scanner that paces itself to a few requests a minute stays
  # under every short window above, but over hours its misses pile up.
  low_and_slow:
    enabled: true
    # Look-back in seconds (6 hours). Longer catches slower scans but holds
    # more state per client and flags long-lived users with stale bookmarks.
    window_seconds: 21600
    # Misses (404/403/410) needed within the window. Lower catches smaller,
    # more patient probes; higher ignores clients with a few broken links.
    min_misses: 40
    # Share of the client's requests that missed (0-1). A real user browsing
    # all day mostly hits pages that exist; a prober mostly misses. Lower
    # flags heavy users who also miss a lot; higher lets a prober hide by
    # mixing in real page loads.
    min_miss_ratio: 0.3
    # Distinct missed paths. Guessing means many different paths; one broken
    # image requested 50 times is not reconnaissance.
    min_distinct_paths: 20
    # Network channel, as for enumeration above.
    ipv6_prefix: 64
    ipv4_prefix: null
    min_distinct: 4

  # ID enumeration (IDOR scraping): walking /api/users/1001, /1002, /1003 ...
  # to harvest records one ID at a time, usually answered 200, so no miss-based
  # detector sees it.
  id_enumeration:
    enabled: true
    # Look-back in seconds (6 hours).
    window_seconds: 21600
    # Distinct IDs on one path template before alerting. Lower catches small
    # scrapes; an admin paging through a list or a mobile app syncing records
    # can legitimately touch dozens.
    min_ids: 25
    # Largest gap between consecutive IDs that still counts as "sequential".
    # Larger catches attackers who skip a few; too large and random lookups
    # of popular records start to look like a walk.
    max_step: 3
    # Share (0-1) of the IDs that must form that walk. Lower catches walks
    # padded with random lookups; higher ignores clients that merely open
    # many records in no particular order.
    min_sequential: 0.7
    # Network channel, as for enumeration above.
    ipv6_prefix: 64
    ipv4_prefix: null
    min_distinct: 4

# ---------------------------------------------------------------------------
# rules: turn individual rule ids off without disabling their detector.
# Disabling a rule hides its alerts entirely, so prefer tuning a threshold or
# allowlisting a client when one rule is noisy for a single known source.
rules:
  SIG-UA-SCANNER: true        # scanner user agents (nikto, sqlmap, nuclei, ...)
  SIG-SENSITIVE-PATH: true    # probes for /.env, /.git/, backups, ...
  SIG-SQLI: true              # SQL injection payloads
  SIG-XSS: true               # script injection payloads
  SIG-TRAVERSAL: true         # ../ and /etc/passwd style traversal
  SIG-CMDI: true              # shell command injection
  SIG-LOG4SHELL: true         # ${jndi:...} lookups (CVE-2021-44228)
  BEH-404-BURST: true         # directory enumeration
  BEH-BRUTE-FORCE: true       # repeated failed logins
  BEH-BRUTE-SUCCESS: true     # a login success after a brute-force run
  BEH-RATE-SPIKE: true        # request floods
  BEH-LOW-AND-SLOW: true      # slow reconnaissance spread over hours
  BEH-ID-ENUM: true           # sequential ID walking (IDOR scraping)

# ---------------------------------------------------------------------------
# scoring: how alerts for one client become a 0-100 incident score.
# See the docstring of watchtower/correlate.py for the full formula.
scoring:
  # Points for the most severe alert in the incident (the starting score).
  severity_points:
    low: 15
    medium: 35
    high: 60
    critical: 85
  # Each distinct rule beyond the first adds this much, up to the cap: a
  # client that trips several unrelated rules is rarely an accident.
  extra_rule: 5
  extra_rule_cap: 15
  # Each kill-chain stage beyond the first (recon, exploit,
  # credential-access, impact) adds this much: a campaign, not a stray hit.
  extra_stage: 10
  # Recon that came before an exploit attempt: the classic scan-then-attack
  # pattern of a deliberate intruder rather than a drive-by bot.
  recon_then_exploit: 10
  # An exploit attempt answered 2xx: the payload may have worked.
  exploit_success: 15
  # A login success after brute force: an account is probably compromised.
  brute_success: 15
  # Score at or above which an incident gets each severity. Raising them
  # makes CI gating (--fail-on) quieter; lowering them makes it stricter.
  severity_cutoffs:
    medium: 30
    high: 55
    critical: 80
